<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2026 Market Intelligence · Ministry Brands</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;600;700&family=Red+Hat+Text:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body data-path="core">
<header>
  <div class="wrap">
    <div class="hrow">
      <p class="brand">Ministry Brands <span>· Market Intelligence</span></p>
      <div class="htools">
        <div class="pathswitch" role="group" aria-label="Plan path">
          <button type="button" data-path="core" aria-pressed="true">Core<small>250–999</small></button>
          <button type="button" data-path="enterprise" aria-pressed="false">Enterprise<small>1,000+</small></button>
          <button type="button" data-path="all" aria-pressed="false">Altogether<small>Both paths</small></button>
        </div>
        <button type="button" class="searchbtn" id="openSearch" aria-haspopup="dialog" aria-controls="palette">
          <span>Search the plan</span>
          <kbd id="kbd">⌘K</kbd>
        </button>
        <span class="meta">Planning only · Live Core HOLD</span>
        <button type="button" class="signout" id="signout">Sign out</button>
      </div>
    </div>
    <nav role="tablist" id="nav" aria-label="Plan"></nav>
  </div>
</header>
<main class="wrap" id="stage">
  <p id="boot" class="note">Reading the plan…</p>
  <div id="hero"></div>
  <div id="sections"></div>
</main>
<aside id="rail" class="rail" hidden aria-labelledby="rail-title">
  <div class="railhead">
    <div>
      <button type="button" class="crumb" id="rail-crumb"></button>
      <p class="railtype" id="rail-type"></p>
      <h2 id="rail-title"></h2>
    </div>
    <button type="button" class="x" id="rail-close" aria-label="Close">Close</button>
  </div>
  <div class="railbody" id="rail-body"></div>
</aside>
<dialog id="palette">
  <form method="dialog">
    <input id="q" type="text" placeholder="Search the plan…" aria-label="Search the plan" autocomplete="off">
  </form>
  <div id="palList"></div>
  <div class="palfoot"><span>↑↓ select</span><span>Enter open</span><span>Esc close</span></div>
</dialog>
<dialog id="lightbox">
  <div class="dh"><b id="lbCap"></b><button type="button" class="x" data-close aria-label="Close">Close</button></div>
  <img id="lbImg" alt="">
  <p id="lbMeta" class="note"></p>
</dialog>
<footer class="site"><div class="wrap"><b>Ministry Brands</b><span>Planning only · Live Core HOLD · Private</span></div></footer>
<script type="module" src="/src/main.js"></script>
</body>
</html>
