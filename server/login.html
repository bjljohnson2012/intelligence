<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · 2026 Market Plan</title>
<style>
  :root { --navy:#0B2545; --sky:#B2E1F6; --teal:#13A89E; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--navy); color:#fff; font-family:system-ui,sans-serif; }
  .card { width:min(440px, calc(100% - 32px)); background:#12315c; border:1px solid var(--sky); border-radius:16px; padding:28px; }
  h1 { font-size:1.5rem; margin:0 0 8px; }
  p { color:var(--sky); line-height:1.45; font-size:16px; }
  label { display:block; margin:16px 0 6px; font-size:16px; }
  input { width:100%; padding:12px; border:0; border-radius:10px; font:inherit; font-size:16px; }
  button { width:100%; margin-top:16px; min-height:44px; background:var(--teal); color:#fff; border:0; border-radius:10px; padding:12px 16px; font:inherit; font-size:16px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  button.link { background:transparent; color:var(--sky); border:1px solid var(--sky); }
  .msg { color:#fff; min-height:1.4em; }
</style>
</head>
<body>
<main class="card">
  <h1>2026 Market Plan</h1>
  <p>Sign in with your email. If it is on the list, we send a 6-digit code. The code expires in 10 minutes.</p>
  <form id="form">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required placeholder="name@example.com">
    <div id="codeWrap" hidden>
      <label for="code">Code</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="6-digit code">
    </div>
    <p class="msg" id="msg" role="status"></p>
    <button id="go" type="submit">Email me a code</button>
    <button id="again" class="link" type="button" hidden>Email a new code</button>
  </form>
</main>
<script>
const form = document.getElementById('form');
const email = document.getElementById('email');
const codeWrap = document.getElementById('codeWrap');
const code = document.getElementById('code');
const msg = document.getElementById('msg');
const go = document.getElementById('go');
const again = document.getElementById('again');
let step = 'email';
let waitTimer = 0;

function say(text) { msg.textContent = text; }

function startWait() {
  let left = 60;
  again.disabled = true;
  again.hidden = false;
  again.textContent = 'You can ask for a new code in 60 seconds';
  clearInterval(waitTimer);
  waitTimer = setInterval(() => {
    left -= 1;
    if (left <= 0) {
      clearInterval(waitTimer);
      again.disabled = false;
      again.textContent = 'Email a new code';
      return;
    }
    again.textContent = 'You can ask for a new code in ' + left + ' seconds';
  }, 1000);
}

async function requestCode() {
  const res = await fetch('/api/auth/request-code', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email.value })
  });
  if (res.status === 429) {
    say('Too many tries. Wait a minute and try again.');
    return false;
  }
  if (!res.ok) {
    say('Enter a valid email address.');
    return false;
  }
  step = 'code';
  codeWrap.hidden = false;
  code.required = true;
  go.textContent = 'Sign in';
  say('If this address is on the list, we sent a code. Check your inbox.');
  startWait();
  code.focus();
  return true;
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  say('');
  go.disabled = true;
  try {
    if (step === 'email') {
      await requestCode();
      return;
    }
    const res = await fetch('/api/auth/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email.value, code: code.value })
    });
    if (res.status === 429) {
      say('Too many tries. Wait a minute and try again.');
      return;
    }
    if (res.ok) {
      location.href = '/';
      return;
    }
    say('That code did not work. Check it, or email yourself a new one.');
  } catch {
    say('Something went wrong. Try again.');
  } finally {
    go.disabled = false;
  }
});

again.addEventListener('click', async () => {
  say('');
  again.disabled = true;
  try { await requestCode(); }
  catch { say('Something went wrong. Try again.'); }
  finally { if (again.textContent === 'Email a new code') again.disabled = false; }
});
</script>
</body>
</html>
