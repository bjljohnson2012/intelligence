<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · 2026 Market Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;600;700&family=Red+Hat+Text:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg:#F4F4F4; --surface:#FFFFFF; --ink:#504A43; --muted:#706B65;
    --line:#EAE9E9; --line2:#C4C4C4; --head:#0F3E80; --accent:#0A5BCC; --lb:#B2E1F6;
    --f-display:"Red Hat Display","Helvetica Neue",Arial,sans-serif;
    --f-body:"Red Hat Text","Helvetica Neue",Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55; }
  .card { width:min(440px, calc(100% - 32px)); background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:28px; }
  .brand { margin:0; font-family:var(--f-display); font-weight:500; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--head); }
  h1 { font-family:var(--f-display); font-weight:500; font-size:28px; line-height:1.15; color:var(--head); margin:8px 0 10px; }
  p { color:var(--ink); margin:0 0 8px; }
  .hint { color:var(--muted); font-size:14px; margin:12px 0 0; }
  label { display:block; margin:16px 0 6px; font-size:13px; font-weight:600; color:var(--head); }
  input { width:100%; padding:12px; border:1px solid var(--line2); border-radius:6px; font:inherit; font-size:16px; background:var(--surface); color:var(--ink); }
  input:focus { outline:2px solid var(--accent); outline-offset:2px; }
  button { width:100%; margin-top:16px; min-height:44px; background:var(--accent); color:#fff; border:0; border-radius:6px; padding:12px 16px; font-family:var(--f-display); font-size:16px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  button.link { background:var(--surface); color:var(--head); border:1px solid var(--line2); }
  .msg { color:var(--head); min-height:1.4em; }
  .card { overflow:visible; }
  .foot { margin-top:18px; padding-left:1px; font-size:12px; letter-spacing:0; text-transform:uppercase; color:var(--muted); overflow:visible; }
</style>
</head>
<body>
<main class="card">
  <p class="brand">Ministry Brands · 2026 Market Intelligence</p>
  <h1>Sign in</h1>
  <p>Sign in with email. If you are on the access list, we will send a 6-digit verification code from ben@benjohnson.ai. Codes expire in 10 minutes.</p>
  <form id="form">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="username" required placeholder="name@example.com">
    <div id="codeWrap" hidden>
      <label for="code">Enter verification code</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="6-digit code" aria-describedby="codeHint">
    </div>
    <p class="hint" id="codeHint">Only the newest code works; each new email replaces the last.</p>
    <p class="msg" id="msg" role="status"></p>
    <button id="go" type="submit">Email me a code</button>
    <button id="again" class="link" type="button" hidden>Resend code</button>
  </form>
  <p class="foot">Gated · Internal planning only</p>
</main>
<script>
const form = document.getElementById('form');
const email = document.getElementById('email');
const codeWrap = document.getElementById('codeWrap');
const code = document.getElementById('code');
const msg = document.getElementById('msg');
const go = document.getElementById('go');
const again = document.getElementById('again');
let step = 'email';
let waitTimer = 0;

function say(text) { msg.textContent = text; }

function startWait() {
  let left = 60;
  again.disabled = true;
  again.hidden = false;
  again.textContent = 'You can ask for a new code in 60 seconds';
  clearInterval(waitTimer);
  waitTimer = setInterval(() => {
    left -= 1;
    if (left <= 0) {
      clearInterval(waitTimer);
      again.disabled = false;
      again.textContent = 'Resend code';
      return;
    }
    again.textContent = 'You can ask for a new code in ' + left + ' seconds';
  }, 1000);
}

async function requestCode() {
  const res = await fetch('/api/auth/request-code', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email.value })
  });
  if (res.status === 429) {
    say('Too many tries. Wait a minute and try again.');
    return false;
  }
  if (!res.ok) {
    say('Enter a valid email address.');
    return false;
  }
  step = 'code';
  codeWrap.hidden = false;
  code.required = true;
  go.textContent = 'Verify';
  say('If this address is on the list, we sent a code. Check your inbox.');
  startWait();
  code.focus();
  return true;
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  say('');
  go.disabled = true;
  try {
    if (step === 'email') {
      await requestCode();
      return;
    }
    const res = await fetch('/api/auth/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email.value, code: code.value })
    });
    if (res.status === 429) {
      say('Too many tries. Wait a minute and try again.');
      return;
    }
    if (res.ok) {
      location.href = '/';
      return;
    }
    say('That code did not work. Check it, or email yourself a new one.');
  } catch {
    say('Something went wrong. Try again.');
  } finally {
    go.disabled = false;
  }
});

again.addEventListener('click', async () => {
  say('');
  again.disabled = true;
  try { await requestCode(); }
  catch { say('Something went wrong. Try again.'); }
  finally { if (again.textContent === 'Resend code') again.disabled = false; }
});
</script>
</body>
</html>
